---
# Remove all machinesets created by this role for the tenant
- name: Get all machinesets for this tenant
  kubernetes.core.k8s_info:
    api_version: machine.openshift.io/v1beta1
    kind: MachineSet
    namespace: openshift-machine-api
  register: r_all_machinesets

- name: Filter machinesets by name pattern (contains guid)
  ansible.builtin.set_fact:
    _tenant_machinesets: >-
      {{ r_all_machinesets.resources
         | selectattr('metadata.name', 'search', '-gpu-' + guid + '-')
         | map(attribute='metadata.name')
         | list }}

- name: Remove tenant machinesets
  when: _tenant_machinesets | length > 0
  kubernetes.core.k8s:
    state: absent
    api_version: machine.openshift.io/v1beta1
    kind: MachineSet
    name: "{{ item }}"
    namespace: openshift-machine-api
  loop: "{{ _tenant_machinesets }}"

- name: Wait for machines to be deleted
  when: _tenant_machinesets | length > 0
  kubernetes.core.k8s_info:
    api_version: machine.openshift.io/v1beta1
    kind: Machine
    namespace: openshift-machine-api
    label_selectors:
      - "machine.openshift.io/cluster-api-machineset={{ item }}"
  register: r_machines
  until: r_machines.resources | length == 0
  retries: 30
  delay: 10
  ignore_errors: true
  loop: "{{ _tenant_machinesets }}"

- name: Print removal status
  ansible.builtin.debug:
    msg: "Removed {{ _tenant_machinesets | length }} machineset(s) for tenant {{ guid }}"
