---
- name: Get cluster infrastructure
  kubernetes.core.k8s_info:
    host: "{{ ocp4_workload_tenant_gpu_machineset_openshift_api_url }}"
    api_key: "{{ ocp4_workload_tenant_gpu_machineset_openshift_api_token }}"
    validate_certs: false
    api_version: config.openshift.io/v1
    kind: Infrastructure
    name: cluster
  register: r_infrastructure

- name: Set infrastructure facts
  ansible.builtin.set_fact:
    _ocp4_workload_tenant_gpu_machineset_platform: "{{ r_infrastructure.resources[0].status.platformStatus.type }}"
    _ocp4_workload_tenant_gpu_machineset_region: "{{ r_infrastructure.resources[0].status.platformStatus.aws.region }}"
    _ocp4_workload_tenant_gpu_machineset_infrastructure_name: "{{ r_infrastructure.resources[0].status.infrastructureName }}"

- name: Verify platform is AWS
  ansible.builtin.assert:
    that:
      - _ocp4_workload_tenant_gpu_machineset_platform == "AWS"
    fail_msg: "This workload only supports AWS platform. Current platform: {{ _ocp4_workload_tenant_gpu_machineset_platform }}"

- name: Get existing machinesets to use as template
  kubernetes.core.k8s_info:
    host: "{{ ocp4_workload_tenant_gpu_machineset_openshift_api_url }}"
    api_key: "{{ ocp4_workload_tenant_gpu_machineset_openshift_api_token }}"
    validate_certs: false
    api_version: machine.openshift.io/v1beta1
    kind: MachineSet
    namespace: openshift-machine-api
  register: r_machinesets

- name: Set worker machineset template
  ansible.builtin.set_fact:
    _ocp4_workload_tenant_gpu_machineset_template: "{{ r_machinesets.resources | selectattr('spec.replicas', 'defined') | selectattr('spec.replicas', 'gt', 0) | first }}"

- name: Create GPU machineset from template
  kubernetes.core.k8s:
    host: "{{ ocp4_workload_tenant_gpu_machineset_openshift_api_url }}"
    api_key: "{{ ocp4_workload_tenant_gpu_machineset_openshift_api_token }}"
    validate_certs: false
    state: present
    definition: "{{ lookup('template', 'machineset-aws-gpu.yml.j2') }}"

- name: Wait for GPU machineset to be available
  when: ocp4_workload_tenant_gpu_machineset_wait_for_nodes | bool
  kubernetes.core.k8s_info:
    host: "{{ ocp4_workload_tenant_gpu_machineset_openshift_api_url }}"
    api_key: "{{ ocp4_workload_tenant_gpu_machineset_openshift_api_token }}"
    validate_certs: false
    api_version: machine.openshift.io/v1beta1
    kind: MachineSet
    name: "{{ ocp4_workload_tenant_gpu_machineset_name }}"
    namespace: openshift-machine-api
  register: r_gpu_machineset
  until:
    - r_gpu_machineset.resources[0].status.availableReplicas is defined
    - r_gpu_machineset.resources[0].status.availableReplicas == ocp4_workload_tenant_gpu_machineset_replicas
  retries: "{{ ocp4_workload_tenant_gpu_machineset_wait_retries }}"
  delay: "{{ ocp4_workload_tenant_gpu_machineset_wait_delay }}"

- name: Wait for GPU nodes to be ready
  when: ocp4_workload_tenant_gpu_machineset_wait_for_nodes | bool
  kubernetes.core.k8s_info:
    host: "{{ ocp4_workload_tenant_gpu_machineset_openshift_api_url }}"
    api_key: "{{ ocp4_workload_tenant_gpu_machineset_openshift_api_token }}"
    validate_certs: false
    api_version: v1
    kind: Node
    label_selectors:
      - "node-role.kubernetes.io/{{ ocp4_workload_tenant_gpu_machineset_role }}="
      - "tenant={{ ocp4_workload_tenant_gpu_machineset_username }}"
  register: r_gpu_nodes
  until:
    - r_gpu_nodes.resources | length == ocp4_workload_tenant_gpu_machineset_replicas
    - r_gpu_nodes.resources | selectattr('status.conditions', 'defined') | map(attribute='status.conditions') | flatten | selectattr('type', 'eq', 'Ready') | selectattr('status', 'eq', 'True') | list | length == ocp4_workload_tenant_gpu_machineset_replicas
  retries: "{{ ocp4_workload_tenant_gpu_machineset_wait_retries }}"
  delay: "{{ ocp4_workload_tenant_gpu_machineset_wait_delay }}"

- name: Print GPU node information
  ansible.builtin.debug:
    msg: "GPU node {{ item.metadata.name }} is ready with {{ item.status.allocatable['nvidia.com/gpu'] | default('0') }} GPU(s)"
  loop: "{{ r_gpu_nodes.resources }}"
  loop_control:
    label: "{{ item.metadata.name }}"
